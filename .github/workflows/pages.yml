name: Deploy AutoRB Web UI to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'webui/static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; new pushes replace the queued deploy.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: the Pages site must match webui/static exactly (the same UI
      # is served by the local engine at /). tests/test_webui.py enforces
      # this in CI; enforce it here too so a bad merge can't split the UIs.
      - name: Verify docs/ is in sync with webui/static/
        run: |
          diff -r webui/static docs \
            || (echo "::error::docs/ is out of sync with webui/static/ — run: cp webui/static/index.html docs/index.html" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
