name: Deploy AutoRB Web UI to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'webui/static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; new pushes replace the queued deploy.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: docs/ is a self-contained LANDING PAGE (install + launch
      # instructions pointing users at the engine's own UI). The live
      # control panel runs on the engine itself (http://127.0.0.1:7860) —
      # browsers' Private Network Access policy blocks a public https origin
      # (GitHub Pages) from calling a loopback engine, so the Pages copy
      # intentionally contains NO engine-calling JS.
      - name: Verify the landing page references the engine UI correctly
        run: |
          python tests/check_pages_landing.py

      # enablement: true creates the Pages site if it does not exist yet
      # (the v0.1.33 merge deploy failed with "Get Pages site failed ... Not
      # Found" when the site was absent — with enablement the workflow
      # self-heals instead of hard-failing).
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
