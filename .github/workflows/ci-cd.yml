name: AutoRB CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov
        # starlette's TestClient needs httpx2 on current releases (the
        # devcontainer's older starlette uses httpx) — the webui tests
        # failed at collection on fresh runners without it.
        pip install httpx2 || pip install httpx
    - name: Run Tests with Coverage
      run: |
        pytest tests/ --cov=autorb --cov-report=term-missing --cov-report=xml:coverage.xml
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from autorb/version.py
      id: version
      run: |
        VERSION=$(python -c "exec(open('autorb/version.py').read()); print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Generate RELEASE_NOTES.txt (user-facing)
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          python tools/gen_release_notes.py --tag "${{ github.ref_name }}"
        else
          python tools/gen_release_notes.py
        fi
    - name: Build Source Package and Wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel
    - name: Verify wheel contains template assets
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        python -c "
        import os, zipfile, sys, glob
        version = os.environ['VERSION']
        whl = glob.glob('dist/*.whl')[0]
        with zipfile.ZipFile(whl) as z:
            names = z.namelist()
            for required in ['template.con', 'template_milo.bin', 'template_png.bin']:
                matches = [n for n in names if required in n]
                if not matches:
                    print(f'FAIL: {required} not found in wheel', file=sys.stderr)
                    sys.exit(1)
                print(f'OK: {matches[0]}')
            # Every feature module must ship in the wheel (a module added to the
            # source tree but forgotten in [tool.setuptools].packages would pass
            # the test job yet break the release artifact).
            for required in ['autorb/cli.py',
                             'autorb/export/clone_hero.py',
                             'autorb/export/alignment_report.py',
                             'autorb/audio/preview.py',
                             'autorb/audio/mix_preview.py',
                             'autorb/export/data/fonts/DejaVuSans.ttf',
                             # v0.1.30 release audit: instruments was missing
                             # from [tool.setuptools].packages — released
                             # wheels could not chart instruments at all.
                             'autorb/transcribe/instruments/__init__.py',
                             'autorb/transcribe/instruments/guitar.py',
                             'autorb/transcribe/instruments/drums.py',
                             'autorb/transcribe/instruments/difficulty.py',
                             # the web UI ships as a core package + script
                             'webui/server.py',
                             'webui/static/index.html']:
                if required not in names:
                    print(f'FAIL: {required} not found in wheel', file=sys.stderr)
                    sys.exit(1)
                print(f'OK: {required}')
            # The user-facing release notes must ship in the wheel and mention the
            # release version.
            rel = [n for n in names if n.endswith('RELEASE_NOTES.txt')]
            if not rel:
                print('FAIL: RELEASE_NOTES.txt not found in wheel', file=sys.stderr)
                sys.exit(1)
            data = z.read(rel[0]).decode('utf-8', 'replace')
            if version not in data:
                print(f'FAIL: RELEASE_NOTES.txt does not mention version {version}', file=sys.stderr)
                sys.exit(1)
            print(f'OK: {rel[0]} (mentions {version})')
        "
    - name: Upload dist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*

  audit:
    # Release audit (v0.1.30): run tools/audit_release.py against the tag we
    # just built — CI state, release assets, wheel contents (every source
    # module + data asset ships), release-notes contract, tag hygiene, a
    # FRESH-VENV install/import smoke of the downloaded wheel (the check
    # that would have caught the v0.1.30-alpha01 crepe/pkg_resources failure
    # and the missing instruments package), and (v0.1.31) a FUNCTIONAL
    # CONVERSION: the wheel-installed CLI runs the committed 60s Open Road
    # Song test clip (tools/test_data/) through the full pipeline and the
    # artifacts are validated (CON/MOGG/MID/Clone Hero folder present and
    # substantial, instrument tracks carry real note counts — the
    # placeholder-class failure catcher). CPU Demucs on 60s adds ~5-10 min;
    # the job carries its own generous timeout.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
    - name: Install FFmpeg (pipeline requirement)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
    - name: Wait for release assets to settle
      run: sleep 20
    - name: Run the release audit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python tools/audit_release.py --tag "${{ github.ref_name }}" \
          --work-dir "$RUNNER_TEMP/audit" --strict
    - name: Upload conversion output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-conversion-output
        path: ${{ runner.temp }}/audit/conversion_out
        if-no-files-found: ignore
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-audit-report
        path: ${{ runner.temp }}/audit/AUDIT_REPORT.txt
        if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Download dist artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Tag wheel/sdist filenames as PEP 440 local versions
      run: |
        TAG="${{ github.ref_name }}"
        # Sanitize the git tag into a PEP 440 local-version label. CRITICAL
        # (v0.1.31-alpha03 audit finding): the local segment must contain NO
        # dashes — pip's wheel-filename parser treats the text after a dash
        # in the local segment as a build number and rejects non-numeric
        # values ("Invalid build number: alpha03"). Dashes become DOTS
        # (underscores work too); everything else non-alnum also becomes a
        # dot. v0.1.31-alpha03 -> v0.1.31.alpha03 -> a pip-accepted
        # autorb-0.1.31+v0.1.31.alpha03-py3-none-any.whl.
        LOCAL="${TAG//[^a-zA-Z0-9._]/.}"
        for f in dist/*; do
          if [[ "$f" == *.whl ]]; then
            newname="${f%-py3-none-any.whl}+${LOCAL}-py3-none-any.whl"
          elif [[ "$f" == *.tar.gz ]]; then
            newname="${f%.tar.gz}+${LOCAL}.tar.gz"
          else
            newname="$f"
          fi
          mv "$f" "$newname"
        done
        ls -la dist/
    - name: Verify tag matches version
      run: |
        VERSION=$(python -c "exec(open('autorb/version.py').read()); print(__version__)")
        TAG="${{ github.ref_name }}"
        PREFIX="v$VERSION"
        # The tag's PREFIX must match autorb/version.py (e.g. v0.0.91...). The SUFFIX is free-form
        # (v0.0.91test02, v0.0.91-test02, ...) so test releases can be tagged without bumping the
        # version each time. A suffix must NOT start with a digit, so a tag like v0.0.911 can't
        # sneak past a version of 0.0.9/0.0.91 ambiguity.
        case "$TAG" in
          "$PREFIX")
            echo "tag $TAG exactly matches autorb/version.py (v$VERSION)" ;;
          "$PREFIX"[^0-9]*)
            echo "tag $TAG matches autorb/version.py prefix v$VERSION (suffix '${TAG#"$PREFIX"}')" ;;
          *)
            echo "::error::tag '$TAG' does not match autorb/version.py (v$VERSION) — bump autorb/version.py and add a CHANGELOG.md entry before tagging, or keep the tag prefix as v$VERSION with an optional suffix"
            exit 1 ;;
        esac
    - name: Generate user-facing release notes (release body)
      run: |
        # Same generator as the build job, so the GitHub Release body and the
        # RELEASE_NOTES.txt bundled in the wheel/sdist are identical. The tag suffix
        # (e.g. test02) is shown as a test-release note but the version stays the
        # autorb/version.py value, so v0.0.91test02 publishes the 0.0.91 notes.
        python tools/gen_release_notes.py --out RELEASE_BODY.md --tag "${{ github.ref_name }}"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "AutoRB ${{ needs.build.outputs.version }} (${{ github.ref_name }})"
        files: dist/*
        body_path: RELEASE_BODY.md