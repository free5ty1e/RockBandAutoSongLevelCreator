name: AutoRB CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest
    - name: Run Tests
      run: |
        pytest tests/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from autorb/version.py
      id: version
      run: |
        VERSION=$(python -c "exec(open('autorb/version.py').read()); print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build Source Package
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: autorb-source-dist
        path: dist/*

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "AutoRB ${{ needs.release.outputs.version }}"
        files: |
          autorb-source-dist/*
        body: |
          # AutoRB ${{ needs.release.outputs.version }}

          Automated Rock Band 3 CON & PS4 PKG Generator using Machine Learning & Signal Processing.

          ## Prerequisites

          * **Python 3.11+** (3.13 is not yet supported by WhisperX)
          * **FFmpeg** — install via Homebrew (`brew install ffmpeg`), apt (`sudo apt install ffmpeg libsndfile1`), or Chocolatey (`choco install ffmpeg`)
          * **mono-devel** (Linux/macOS) or **Mono** (Windows) — only needed for `--build-pkg`

          ## Quick Start (Recommended: git clone)

          ```bash
          git clone https://github.com/chrispaiano/RockBandAutoSongLevelCreator.git
          cd RockBandAutoSongLevelCreator
          python -m venv venv && source venv/bin/activate
          pip install -r requirements.txt
          pip install -e .
          python -m autorb.cli input/song.mp3 --artist "Artist" --title "Title" --year 2024 --genre "Rock" --lyrics input/song.lrc --output-dir ./output --build-pkg
          ```

          ## Installing from this release

          1. Download the `.whl` file below (`autorb-*.whl`).
          2. Create a venv and install:
             ```bash
             python -m venv venv && source venv/bin/activate
             pip install ./autorb-*.whl
             ```
             Note: this installs ML dependencies (PyTorch, WhisperX, Demucs) — first install takes a few minutes.
          3. Run:
             ```bash
             python -m autorb.cli path/to/song.mp3 --artist "Artist" --title "Title" --year 2024 --genre "Rock" --lyrics path/to/lyrics.lrc --output-dir ./output
             ```

          The `--build-pkg` flag generates a PS4 PKG installer via the vendored ForgeTool (requires `mono`; run from a git clone).
          If you get a "ForgeTool not found" error, ensure you are running from the repository root or installed via the `.whl`.

          ## Finding Lyrics

          AutoRB uses Enhanced LRC files (`.lrc`) for word-level vocal timing:
          * **lrclib.net** — search by song/artist, download timestamped LRC files
          * **lrcgenerator.com** — create your own synced lyrics

          Example format:
          ```lrc
          [00:12.34]Tonight, the night
          [00:15.80]When the world was young
          ```