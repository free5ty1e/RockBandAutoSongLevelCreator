name: AutoRB CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest
    - name: Run Tests
      run: |
        pytest tests/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build Source Package
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: autorb-source-dist
        path: dist/*

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          autorb-source-dist/*
        body: |
          # 🎸 AutoRB Release

          Automated Rock Band 3 CON & PS4 PKG Generator using Machine Learning & Signal Processing.

          ## 📥 Quick Start (macOS, Windows, Linux)

          1. **Prerequisites:** Make sure you have **Python 3.11+** and **FFmpeg** installed on your system.
          2. **Download & Extract:** Download the source package (`.tar.gz` or `.whl`) or clone the repository.
          3. **Install:**
             ```bash
             pip install autorb-*.whl
             ```
          4. **Prepare Lyrics (`.lrc` Files):**
             AutoRB relies on Enhanced LRC (`.lrc`) lyric files for precise timing. You can download synced LRC files from sites like [LRC LIB](https://lrclib.net/) or create them with tools like [LRC Generator](https://www.lrcgenerator.com/).
             Example `.lrc` format:
             ```lrc
             [00.12.34]Tonight, the night
             [00.15.80]When the world was young
             [00.18.45]And we were free
             ```
          5. **Run:**
             ```bash
             python -m autorb.cli path/to/song.mp3 --artist "Artist" --title "Title" --year 2024 --genre "Rock" --lyrics path/to/lyrics.lrc --output-dir ./output --build-pkg
             ```

        