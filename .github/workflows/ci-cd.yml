name: AutoRB CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest
    - name: Run Tests
      run: |
        pytest tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from autorb/version.py
      id: version
      run: |
        VERSION=$(python -c "exec(open('autorb/version.py').read()); print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build Source Package and Wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel
    - name: Verify wheel contains template assets
      run: |
        python -c "
        import zipfile, sys, glob
        whl = glob.glob('dist/*.whl')[0]
        with zipfile.ZipFile(whl) as z:
            names = z.namelist()
            for required in ['template.con', 'template_milo.bin', 'template_png.bin']:
                matches = [n for n in names if required in n]
                if not matches:
                    print(f'FAIL: {required} not found in wheel', file=sys.stderr)
                    sys.exit(1)
                print(f'OK: {matches[0]}')
        "
    - name: Upload dist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download dist artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Tag wheel/sdist filenames as PEP 440 local versions
      run: |
        TAG="${{ github.ref_name }}"
        # Sanitize the git tag into a PEP 440 local-version label (alnum, dot, underscore, hyphen).
        # Appending to the VERSION (e.g. autorb-0.62+v0.005xTest17-py3-none-any.whl) keeps the
        # wheel filename valid for pip; appending after the platform tag (the old behavior) made
        # pip reject the file with "Invalid build number".
        LOCAL="${TAG//[^a-zA-Z0-9._-]/-}"
        for f in dist/*; do
          if [[ "$f" == *.whl ]]; then
            newname="${f%-py3-none-any.whl}+${LOCAL}-py3-none-any.whl"
          elif [[ "$f" == *.tar.gz ]]; then
            newname="${f%.tar.gz}+${LOCAL}.tar.gz"
          else
            newname="$f"
          fi
          mv "$f" "$newname"
        done
        ls -la dist/
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "AutoRB ${{ needs.build.outputs.version }} (${{ github.ref_name }})"
        files: dist/*
        body: |
          # AutoRB ${{ needs.build.outputs.version }} (${{ github.ref_name }})

          Automated Rock Band 3 CON & PS4 PKG Generator using Machine Learning & Signal Processing.

          ## Prerequisites

          * **Python 3.11, 3.12, or 3.13**. **Python 3.14 is NOT supported** — WhisperX (a hard dependency) caps at `<3.14`, and the wheel's `Requires-Python` enforces `>=3.11,<3.14`, so pip refuses 3.14 early with a clear message.
            * **macOS users**: your system `python3` is likely **3.9.6** (too old). Install a current Python first: `brew install python@3.12`, or download from [python.org](https://www.python.org/downloads/), then use `python3.12` below instead of `python3`. Check with `python3 --version`.
          * **FFmpeg** — install via Homebrew (`brew install ffmpeg`), apt (`sudo apt install ffmpeg libsndfile1`), or Chocolatey (`choco install ffmpeg`)
          * **mono-devel** (Linux/macOS) or **Mono** (Windows) — only needed for `--build-pkg`

          ## Quick Start (Recommended: git clone)

          ```bash
          git clone https://github.com/chrispaiano/RockBandAutoSongLevelCreator.git
          cd RockBandAutoSongLevelCreator
          python3 -m venv venv && source venv/bin/activate
          pip3 install -r requirements.txt
          pip3 install -e .
          python3 -m autorb.cli input/song.mp3 --artist "Artist" --title "Title" --year 2024 --genre "Rock" --lyrics input/song.lrc --output-dir ./output --build-pkg
          ```

          ## Installing from this release

          1. Download the `.whl` file below (`autorb-*.whl`).
          2. Make sure you have Python 3.11+ (see Prerequisites — macOS defaults to 3.9.6, which is too old). Create a venv and install:
           ```bash
           python3 -m venv venv && source venv/bin/activate
           python3 -c "import sys; assert sys.version_info >= (3, 11), 'Need Python 3.11+ — your venv used an old python3'"
           pip3 install ./autorb-*.whl
           ```
           Note: this installs ML dependencies (PyTorch, WhisperX, Demucs) — first install takes a few minutes.
          3. Run:
           ```bash
           python3 -m autorb.cli path/to/song.mp3 --artist "Artist" --title "Title" --year 2024 --genre "Rock" --lyrics path/to/lyrics.lrc --output-dir ./output
           ```
           
          The `--build-pkg` flag generates a PS4 PKG installer via the vendored ForgeTool (requires `mono`; run from a git clone).

          ## Finding Lyrics

          AutoRB uses Enhanced LRC files (`.lrc`) for word-level vocal timing:
          * **lrclib.net** — search by song/artist, download timestamped LRC files
          * **lrcgenerator.com** — create your own synced lyrics

          Example format:
          ```lrc
          [00:12.34]Tonight, the night
          [00:15.80]When the world was young
          ```

          ## Installing from this release

          1. Download the `.whl` file below (`autorb-*.whl`).
          2. Create a venv and install:
             ```bash
             python3 -m venv venv && source venv/bin/activate
             pip3 install ./autorb-*.whl
             ```
             Note: this installs ML dependencies (PyTorch, WhisperX, Demucs) — first install takes a few minutes.
          3. Run:
             ```bash
             python3 -m autorb.cli path/to/song.mp3 --artist "Artist" --title "Title" --year 2024 --genre "Rock" --lyrics path/to/lyrics.lrc --output-dir ./output
             ```

          The `--build-pkg` flag generates a PS4 PKG installer via the vendored ForgeTool (requires `mono`; run from a git clone).
          If you get a "ForgeTool not found" error, ensure you are running from the repository root or installed via the `.whl`.

          ## Finding Lyrics

          AutoRB uses Enhanced LRC files (`.lrc`) for word-level vocal timing:
          * **lrclib.net** — search by song/artist, download timestamped LRC files
          * **lrcgenerator.com** — create your own synced lyrics

          Example format:
          ```lrc
          [00:12.34]Tonight, the night
          [00:15.80]When the world was young
          ```