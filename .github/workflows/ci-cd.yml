name: AutoRB CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov
    - name: Run Tests with Coverage
      run: |
        pytest tests/ --cov=autorb --cov-report=term-missing --cov-report=xml:coverage.xml
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from autorb/version.py
      id: version
      run: |
        VERSION=$(python -c "exec(open('autorb/version.py').read()); print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build Source Package and Wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel
    - name: Verify wheel contains template assets
      run: |
        python -c "
        import zipfile, sys, glob
        whl = glob.glob('dist/*.whl')[0]
        with zipfile.ZipFile(whl) as z:
            names = z.namelist()
            for required in ['template.con', 'template_milo.bin', 'template_png.bin']:
                matches = [n for n in names if required in n]
                if not matches:
                    print(f'FAIL: {required} not found in wheel', file=sys.stderr)
                    sys.exit(1)
                print(f'OK: {matches[0]}')
            # Every feature module must ship in the wheel (a module added to the
            # source tree but forgotten in [tool.setuptools].packages would pass
            # the test job yet break the release artifact).
            for required in ['autorb/cli.py',
                             'autorb/export/clone_hero.py',
                             'autorb/export/alignment_report.py',
                             'autorb/audio/preview.py',
                             'autorb/audio/mix_preview.py',
                             'autorb/export/data/fonts/DejaVuSans.ttf']:
                if required not in names:
                    print(f'FAIL: {required} not found in wheel', file=sys.stderr)
                    sys.exit(1)
                print(f'OK: {required}')
        "
    - name: Upload dist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Download dist artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Tag wheel/sdist filenames as PEP 440 local versions
      run: |
        TAG="${{ github.ref_name }}"
        # Sanitize the git tag into a PEP 440 local-version label (alnum, dot, underscore, hyphen).
        # Appending to the VERSION (e.g. autorb-0.62+v0.005xTest17-py3-none-any.whl) keeps the
        # wheel filename valid for pip; appending after the platform tag (the old behavior) made
        # pip reject the file with "Invalid build number".
        LOCAL="${TAG//[^a-zA-Z0-9._-]/-}"
        for f in dist/*; do
          if [[ "$f" == *.whl ]]; then
            newname="${f%-py3-none-any.whl}+${LOCAL}-py3-none-any.whl"
          elif [[ "$f" == *.tar.gz ]]; then
            newname="${f%.tar.gz}+${LOCAL}.tar.gz"
          else
            newname="$f"
          fi
          mv "$f" "$newname"
        done
        ls -la dist/
    - name: Verify tag matches version
      run: |
        VERSION=$(python -c "exec(open('autorb/version.py').read()); print(__version__)")
        if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
          echo "::error::tag '${{ github.ref_name }}' does not match autorb/version.py (v$VERSION) — bump autorb/version.py and add a CHANGELOG.md entry before tagging"
          exit 1
        fi
        echo "tag v$VERSION matches autorb/version.py"
    - name: Extract release notes from CHANGELOG
      run: |
        python - <<'PYEOF'
        import re, sys
        version = "${{ github.ref_name }}".lstrip("v")
        text = open("CHANGELOG.md", encoding="utf-8").read()
        m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
        if not m:
            sys.stderr.write(f"::error::no CHANGELOG entry for v{version} — add one before tagging\n")
            sys.exit(1)
        header = (f"# AutoRB v{version}\n\n"
                  "Automated Rock Band 3 CON & PS4 PKG Generator using Machine Learning & Signal Processing.\n\n"
                  "See the README for full install/usage instructions. Changelog for this release:\n\n")
        open("RELEASE_BODY.md", "w", encoding="utf-8").write(header + m.group(1).strip() + "\n")
        PYEOF
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "AutoRB ${{ needs.build.outputs.version }} (${{ github.ref_name }})"
        files: dist/*
        body_path: RELEASE_BODY.md