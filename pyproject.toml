[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autorb"
dynamic = ["version"]
description = "Automated Rock Band 3 CON File Generator"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "demucs>=4.0.0",
    "librosa>=0.10.1",
    "whisperx>=3.1.1",
    "mido>=1.3.0",
    "pretty_midi>=0.2.10",
    "construct>=2.10.69",
    "pydub",
    "soundfile",
    "onnxruntime",
    "mir-eval",
    "resampy<0.4.3,>=0.2.2"
]

[tool.setuptools.dynamic]
version = {attr = "autorb.version.__version__"}

[tool.setuptools]
packages = ["autorb", "autorb.audio", "autorb.export", "autorb.pitch"]

[tool.setuptools.package-data]
autorb = ["export/data/*.con", "export/data/*.bin"]
"autorb.pitch" = ["*.onnx"]


