[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autorb"
version = "0.1.0"
description = "Automated Rock Band 3 CON File Generator"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "demucs>=4.0.0",
    "librosa>=0.10.1",
    "basic-pitch>=0.3.0",
    "whisperx>=3.1.1",
    "mido>=1.3.0",
    "pretty_midi>=0.2.10",
    "construct>=2.10.69",
    "pydub",
    "soundfile"
]

[tool.setuptools]
packages = ["autorb", "autorb.audio", "autorb.export"]
