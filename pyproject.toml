[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autorb"
dynamic = ["version"]
description = "Automated Rock Band 3 CON File Generator"
# WhisperX (hard dependency for vocal alignment) caps at Python <3.14, and the
# only whisperx release without an upper bound (3.2.0) pins ctranslate2==4.4.0,
# which ships no cp314 wheel. Enforce the upper bound so pip refuses fast and
# clearly on 3.14+ instead of failing with a cryptic "ctranslate2==4.4.0" error.
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.1.7",
    "demucs>=4.0.0",
    "librosa>=0.10.1",
    "whisperx>=3.1.1",
    "mido>=1.3.0",
    "pretty_midi>=0.2.10",
    "construct>=2.10.69",
    "pydub",
    "soundfile",
    "onnxruntime",
    "mir-eval",
    "resampy<0.4.3,>=0.2.2",
    # resampy 0.4.2 imports pkg_resources, which setuptools>=82 deletes. Pin
    # setuptools below 82 so a bare wheel install gets pkg_resources too
    # (the wheel's own deps previously shipped no setuptools at all, so
    # --skip-vocals crashed with ModuleNotFoundError: No module named 'pkg_resources').
    "setuptools>=68.0.0,<82.0.0",
    # Syllable segmentation (guarded imports in syllables.py /
    # midi_generator.py fall back to simpler splits without it, but the
    # fallback degrades vocal charting silently — pyphen is a tiny pure-Py
    # package and belongs in the core deps like every actually-imported
    # module; found while building the functional conversion smoke).
    "pyphen>=0.10",
    # Web UI engine — CORE deps as of v0.1.30 (was an optional [web] extra):
    # the wheel ships the `autorb-webui` console script and the webui
    # package, so a plain `pip install autorb` must be able to run it
    # (the release audit's fresh-venv smoke caught the gap: webui.server
    # was unimportable without the extra).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Retained for backward compatibility: installing autorb[web] is now a no-op
# beyond the core deps (the web deps moved to core in v0.1.30 — see above).
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.setuptools.dynamic]
version = {attr = "autorb.version.__version__"}

[project.scripts]
autorb-webui = "webui.server:main"

[tool.pytest.ini_options]
markers = [
    # Tests needing the full devcontainer environment (headless browser,
    # Clone Hero/X11, etc.) — excluded from default CI runs.
    "devcontainer: needs the devcontainer environment (browser, X11, audio)",
]

[tool.setuptools]
# NOTE (v0.1.30 release audit): the explicit list must name EVERY package —
# `autorb.transcribe.instruments` was missing, so released wheels shipped
# WITHOUT the instrument charting modules (guitar/bass/drums/keys) and
# `from autorb.transcribe.instruments import transcribe_guitar` failed for
# every wheel user. It worked only in the devcontainer's editable install.
# tools/audit_release.py stage 3.2 compares this list against the wheel's
# actual files (and tests/test_audit_release.py pins the lesson).
packages = ["autorb", "autorb.audio", "autorb.export", "autorb.pitch",
            "autorb.reference", "autorb.transcribe", "autorb.transcribe.instruments", "webui"]

[tool.setuptools.package-data]
autorb = ["export/data/*.con", "export/data/*.bin", "export/data/fonts/*.ttf"]
"autorb.pitch" = ["*.onnx"]
# The web UI's static files must ship with the wheel — the engine serves
# webui/static/index.html at / (and docs/ deploys the same file to GitHub
# Pages). Without this entry the wheel's engine had no UI.
webui = ["static/*.html", "static/.nojekyll"]

# The user-facing release notes (how-to + features + changelog) are generated by
# tools/gen_release_notes.py at build time and shipped inside the wheel and sdist so
# archive users get them without a browser.
[tool.setuptools.data-files]
"." = ["RELEASE_NOTES.txt"]


