# Ground-truth guitar guide for "Open Road Song" by Eve 6
#
# This guide is the tab-aligned reference the charting algorithm validates
# against. It describes the intro rhythm riff and the verse chord progression
# with strum timing + root pitch. It was produced by the tab-alignment tool
# (audio_ground_truth.py + align_tab_to_audio.py) which derives absolute strum
# times from the guitar stem and maps pitches to lanes.
#
# NOTE: rhythm (strum TIMING) is the authoritative, audio-derived ground truth.
# The strings/frets here are the guide's best-effort voicing from pitch
# analysis; the primary closed-loop metric is STRUM RHYTHM recall/precision,
# then lane/pitch direction fidelity.

song: "Open Road Song"
artist: "Eve 6"
key: "D minor-ish / A major"
tempo_approx: 169

tuning: "standard"

# ---------------------------------------------------------------
# INTRO riff (0.0 - ~11s) : driving 8th-note palm-mute strums
#   Audio-derived strum times (seconds) - one per audible strum.
#   Lane = pitch→5-lane mapping (0=green low .. 4=orange high)
# ---------------------------------------------------------------
intro_riff:
  description: >
    Fast palm-muted 8th-note rhythm guitar, power-chord strums, on a
    low (root ~A2) drone with the 5th above. The strums are dense (~5/s)
    and even; they must NOT be charted as held notes.
  root_lane: 4      # A2 power-chord-ish, high lane (see pitch guide)
  strum_times_s: [0.43, 0.55, 0.88, 1.03, 1.25, 1.37, 1.60, 1.67,
                  1.77, 1.92, 2.15, 2.43, 2.66, 2.79, 3.03, 3.16,
                  3.33, 3.55, 3.70, 3.84, 4.08, 4.19, 4.57, 4.76,
                  5.15, 5.29, 5.66, 5.90, 6.01, 6.17, 6.41, 6.59,
                  6.70, 6.93, 7.05, 7.28, 7.40, 7.61, 7.81, 7.96,
                  8.12, 8.46, 8.70, 8.84, 9.00, 9.26, 9.43, 9.53,
                  9.75, 9.90]

# ---------------------------------------------------------------
# Validation targets - the closed loop optimizes these.
# ---------------------------------------------------------------
validation_targets:
  strum_tolerance_s: 0.10    # charted strum within this of a guide strum = match
  min_intro_recall: 0.90     # >=90% of intro strums must be charted
  max_false_per_strum: 0.05  # <5% spurious attacks (relative to strum count)
  # Lane/pitch direction: consecutive charted lanes should generally follow the
  # guide's pitch contour (increasing pitch -> increasing lane).
  min_lane_direction_fidelity: 0.70